[workspace]
resolver = "3"
members = [
    "crates/ddc-core",
    "crates/ddc-adapters",
    "crates/ddc-cli",
    "apps/ddc-tray/src-tauri",
]

[workspace.package]
# 0.0.0 on purpose: CI stamps the version it computes from the commits into
# the release build and the packages, with no bot commit on main
# (D-2026-09-28-release-packaging-10). A local `--version` says 0.0.0.
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
ddc-core = { path = "crates/ddc-core" }
ddc-adapters = { path = "crates/ddc-adapters" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
