[workspace]
resolver = "3"
members = ["crates/ddc-core", "crates/ddc-adapters", "crates/ddc-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
ddc-core = { path = "crates/ddc-core" }
ddc-adapters = { path = "crates/ddc-adapters" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
