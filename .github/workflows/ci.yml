name: CI

# ddc-control's CI is one call to the shared pipeline of
# slipalison/github-workflows (pipeline.yml), the entry point every
# application repository uses (D-2026-09-28-ci-full-pipeline-1). In parallel
# it runs:
#   versao     the next version from the Conventional Commits; a commit
#              outside them fails the run
#   qualidade  one job per component: fmt, `cargo audit`, clippy, the tests
#              with the coverage floor, the release build and the packages
#   seguranca  Gitleaks over the whole history, TruffleHog over the new
#              commits, Semgrep, Trivy
#              on the lockfiles, the SBOM, and CodeQL for Rust, JS/TS and
#              these workflows
#   sonar      Sonar analysis and its Quality Gate, with Rust and JS coverage
# and then `Portao`, one check that fails when any of them failed. Only on
# main, on a push or a manual run (never a pull request), and only after all
# of them passed, `lancar` tags and publishes the GitHub Release with the
# packages. There is no image and no deploy: with
# `imagem` and `app` empty, the pipeline skips both.
#
# Until 2026-09-28 this file called versao, qualidade and lancar directly, and
# v0.1.0 went out without the security scans, Sonar or the gate.
#
# PINNED TO A COMMIT, NOT A BRANCH (D-2026-09-28-ci-full-pipeline-5). The
# github-workflows PR that lets a desktop app use pipeline.yml is under
# review, and pipeline.yml calls its nested workflows at @main, which does
# not have that PR yet. The commit below is that PR's head with the nested
# workflows pinned to it, on a throwaway branch, so a run here is the PR's
# exact code. Once the PR is merged, this becomes @main.

on:
  push:
    # Only main. The `ensaio-release/**` rehearsal of the previous phase is
    # gone: a draft release there would have to pass the Sonar gate, and
    # SonarQube Cloud's free plan analyzes only the main branch and pull
    # requests (run 36498449337: "Not authorized or project not found" on the
    # Quality Gate). Every pull request's packages stay downloadable as run
    # artifacts (D-2026-09-28-ci-full-pipeline-1).
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same ref cancels the older run: the Windows job takes
# tens of minutes without cache, and three pushes would queue three of them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  esteira:
    # A reusable workflow never gets more than the caller grants here.
    permissions:
      contents: write        # the tag and the release (lancar, main only)
      # No image, but lancar.yml's `alias` job (skipped here) asks for it,
      # and GitHub checks a reusable workflow's permissions statically:
      # without it the run dies in startup_failure.
      packages: write
      security-events: write # SARIF of the scans and of CodeQL
      actions: read          # CodeQL
    uses: slipalison/github-workflows/.github/workflows/pipeline.yml@71f8b07862f1a4c295f40d48173a2acf9edda3e8
    with:
      # The first release, while the repository had no `vX.Y.Z` tag.
      versao_inicial: "0.1.0"

      # --------------------------------------------------------- quality --
      # Tauri compiles three times per Rust job (clippy, llvm-cov, release),
      # then once more to bundle. With no cache, the first run took 13
      # minutes on Windows and 7 on Linux (run 36341518707); the limit is
      # only there to stop a hung job.
      timeout_qualidade: 60
      # One job per component, in parallel. The names are a contract: the
      # release attaches the `pacotes-rust-*` artifacts, and the phases'
      # evidence queries the run's jobs by them.
      #
      # rust-linux: fmt, `cargo audit` (exceptions in .cargo/audit.toml),
      #   clippy -D warnings, the tests under cargo llvm-cov with the
      #   project's 80% line floor, the ddc-tray release binary, and the
      #   packages: deb, rpm and AppImage of ddc-tray and the ddc-cli .tar.gz,
      #   stamped with the version `versao` computed (Cargo.toml says 0.0.0).
      #   Rust 1.98 is the toolchain the code is linted with locally, so a
      #   lint new in a later stable cannot fail a PR out of the blue.
      #   ubuntu-22.04, not latest (D-2026-09-28-release-packaging-9): the
      #   packages link against the glibc of the system that builds them, and
      #   the 24.04 one (2.39) would not run on Ubuntu 22.04, Debian 12 or
      #   Mint 21.
      #   apt packages, and why:
      #     libwebkit2gtk-4.1-dev  Tauri's webview on Linux (webkit2gtk-sys,
      #                            soup3-sys, javascriptcore-rs-sys); it also
      #                            brings the GTK 3, GLib and D-Bus (-dev)
      #                            libraries tao and wry link.
      #     libudev-dev            libudev-sys, under ddc-hi's i2c backend.
      #     librsvg2-dev           the AppImage's gtk plugin (linuxdeploy)
      #                            looks librsvg-2.0 up with pkg-config to
      #                            bundle the SVG loader.
      # rust-windows: the same steps on windows-latest except the audit (the
      #   Cargo.lock is the same file), with the MSI, the NSIS installer and
      #   the ddc-cli .zip. Coverage 0: the panel still reports it, but the
      #   floor is measured on Linux.
      # node-ui: `npm test` in apps/ddc-tray: the node --test suites, whose
      #   coverage of the popup's modules has the 80% floor
      #   (D-2026-09-28-ci-full-pipeline-4), then the Playwright suite. The
      #   DOM glue (src/app.js) is only exercised by Playwright and is not in
      #   that number. Node 24: the test runner's glob and coverage flags.
      componentes: |
        [
          {"nome":"rust-linux","linguagem":"rust","versao":"1.98","cobertura":80,
           "so":"ubuntu-22.04",
           "pacotes_sistema":"libwebkit2gtk-4.1-dev libudev-dev librsvg2-dev",
           "auditoria":true,"build_release":"ddc-tray",
           "empacotar_tauri":true,"caminho_tauri":"apps/ddc-tray/src-tauri",
           "binarios_extra":"ddc-cli","carimbar_versao":true},
          {"nome":"rust-windows","linguagem":"rust","versao":"1.98","so":"windows-latest",
           "cobertura":0,"build_release":"ddc-tray",
           "empacotar_tauri":true,"caminho_tauri":"apps/ddc-tray/src-tauri",
           "binarios_extra":"ddc-cli","carimbar_versao":true},
          {"nome":"node-ui","linguagem":"node","versao":"24","caminho":"apps/ddc-tray",
           "cobertura":80}
        ]

      # --------------------------------------------------------- release --
      # Only the two Rust components that package (`pacotes-rust-linux`,
      # `pacotes-rust-windows`). `pacotes-*` would also attach any artifact
      # another job of the run uploaded under that prefix, node-ui included,
      # which runs third-party npm code (D-2026-09-28-release-packaging-7).
      artefatos_release: "pacotes-rust-*"
      changelog: CHANGELOG.md

      # -------------------------------------------------------- security --
      # The repository is public, so CodeQL is free and its results, like the
      # other scans' SARIF, land in the Security tab
      # (D-2026-09-28-ci-full-pipeline-2). No IaC to scan: no Dockerfile,
      # manifest or chart.
      linguagens_codeql: '["rust","javascript-typescript","actions"]'

      # ----------------------------------------------------------- sonar --
      # Analysis on CI, not SonarQube Cloud's Automatic Analysis, which must
      # stay OFF for this project: it read no Rust and no coverage, and with
      # it on the CI scanner fails (D-2026-09-28-ci-full-pipeline-3). The
      # script writes the Rust and the UI LCOV reports, and its cargo llvm-cov
      # compiles the workspace: hence the same toolchain and the webview and
      # udev headers (librsvg is only for the AppImage). Sonar's Rust analyzer
      # itself compiles nothing and runs no Clippy (measured on run
      # 36494608449); Clippy with -D warnings is the quality jobs' gate.
      sonar_projeto: slipalison_ddc-control
      sonar_linguagem: rust
      sonar_versao_linguagem: "1.98"
      sonar_pacotes_sistema: "libwebkit2gtk-4.1-dev libudev-dev"
      sonar_comando_testes: bash scripts/ci/sonar-coverage.sh
      # Rust tests live in `tests.rs` modules and `tests/` directories, and
      # the UI's in apps/ddc-tray/tests: the same two patterns split sources
      # from tests, so no file is indexed twice.
      sonar_parametros: |
        sonar.sources=crates,apps/ddc-tray/src,apps/ddc-tray/src-tauri/src,apps/ddc-tray/src-tauri/build.rs
        sonar.tests=crates,apps/ddc-tray/src-tauri/src,apps/ddc-tray/src-tauri/tests,apps/ddc-tray/tests
        sonar.exclusions=**/tests.rs,**/tests/**
        sonar.test.inclusions=**/tests.rs,**/tests/**
        sonar.rust.cargo.manifestPaths=Cargo.toml
        sonar.rust.lcov.reportPaths=resultados/lcov.info
        sonar.javascript.lcov.reportPaths=resultados/lcov-ui.info
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
