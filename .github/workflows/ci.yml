name: CI

# ddc-control's CI is this one caller: every build, lint, test, packaging and
# release step lives in the reusable workflows of slipalison/github-workflows,
# which this repo extends there and never copies here
# (D-2026-09-27-ci-crossbuild-1, D-2026-09-28-release-packaging-1).
#
# PINNED TO A COMMIT, NOT A BRANCH. While the github-workflows PR that adds
# the Tauri packages, the stamped version and the release attachments is
# under review, every `uses:` below points at that PR's head commit, so a run
# here is tied to the exact template code being reviewed. Once that PR is
# merged, each `@<sha>` is swapped for `@main`.

on:
  push:
    # `ensaio-release/**` is the release rehearsal
    # (D-2026-09-28-release-packaging-8): a push there runs this file as it
    # is in the pushed commit, so the whole release job is proven before the
    # merge, and `lancar` only creates a DRAFT release there (no tag, not
    # public). Only `main` publishes.
    branches: [main, 'ensaio-release/**']
  pull_request:
  workflow_dispatch:

# A newer commit on the same ref cancels the older run: the Windows job takes
# tens of minutes without cache, and three pushes would queue three of them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Computes the next version from the Conventional Commits and rejects a
  # commit outside them; it never creates a tag or a release (`lancar` does,
  # last). `versao_inicial` is the first release, while the repository has no
  # `vX.Y.Z` tag; `lancar` below repeats the same literal.
  versao:
    permissions:
      contents: read
    uses: slipalison/github-workflows/.github/workflows/versao.yml@d6d340a96e2d2bc645e6e5a4c1e2dfba5637b901
    with:
      versao_inicial: "0.1.0"

  qualidade:
    # Needs the version: Cargo.toml says 0.0.0, and the packages are stamped
    # with the version this run computes (D-2026-09-28-release-packaging-10).
    # On a pull request that is the version the merge will get, so the PR's
    # packages are already the next release's.
    needs: [versao]
    permissions:
      contents: read
    uses: slipalison/github-workflows/.github/workflows/qualidade.yml@d6d340a96e2d2bc645e6e5a4c1e2dfba5637b901
    with:
      # Tauri compiles three times per Rust job (clippy, llvm-cov, release),
      # then once more to bundle. With no cache, the first run took 13
      # minutes on Windows and 7 on Linux (run 36341518707); the limit is
      # only there to stop a hung job.
      timeout: 60
      versao: ${{ needs.versao.outputs.versao }}
      # One job per component, in parallel. The names are a contract: the
      # phase's evidence queries the run's jobs, steps and artifacts
      # (`pacotes-rust-linux`, `pacotes-rust-windows`) by them.
      #
      # rust-linux: fmt, `cargo audit` (exceptions in .cargo/audit.toml),
      #   clippy -D warnings, the tests under cargo llvm-cov with the project's
      #   80% line floor, the ddc-tray release binary, and the packages: deb,
      #   rpm and AppImage of ddc-tray and the ddc-cli .tar.gz. Rust 1.98 is
      #   the toolchain the code is linted with locally, so a lint new in a
      #   later stable cannot fail a PR out of the blue.
      #   ubuntu-22.04, not latest (D-2026-09-28-release-packaging-9): the
      #   packages link against the glibc of the system that builds them, and
      #   the 24.04 one (2.39) would not run on Ubuntu 22.04, Debian 12 or
      #   Mint 21. On 22.04 (2.35) they run there and on anything newer.
      #   apt packages, and why:
      #     libwebkit2gtk-4.1-dev  Tauri's webview on Linux (webkit2gtk-sys,
      #                            soup3-sys, javascriptcore-rs-sys); it also
      #                            brings the GTK 3, GLib and D-Bus (-dev)
      #                            libraries tao and wry link.
      #     libudev-dev            libudev-sys, under ddc-hi's i2c backend.
      #     librsvg2-dev           the AppImage's gtk plugin (linuxdeploy)
      #                            looks librsvg-2.0 up with pkg-config to
      #                            bundle the SVG loader.
      #   Not listed, because nothing in the Linux build uses them: the
      #   appindicator libraries (the Linux tray is ksni over D-Bus), libxdo
      #   and OpenSSL.
      # rust-windows: the same steps on windows-latest except the audit (the
      #   Cargo.lock is the same file; auditing it twice proves nothing new),
      #   with the MSI, the NSIS installer and the ddc-cli .zip. Coverage 0:
      #   the panel still reports it, but the floor is measured on Linux.
      # node-ui: `npm test` in apps/ddc-tray, which runs the node --test suites
      #   and the Playwright suite (Chromium installed with its system
      #   libraries only on a GitHub-hosted runner). Node 24: the node --test
      #   glob needs Node >= 21.
      componentes: |
        [
          {"nome":"rust-linux","linguagem":"rust","versao":"1.98","cobertura":80,
           "so":"ubuntu-22.04",
           "pacotes_sistema":"libwebkit2gtk-4.1-dev libudev-dev librsvg2-dev",
           "auditoria":true,"build_release":"ddc-tray",
           "empacotar_tauri":true,"caminho_tauri":"apps/ddc-tray/src-tauri",
           "binarios_extra":"ddc-cli","carimbar_versao":true},
          {"nome":"rust-windows","linguagem":"rust","versao":"1.98","so":"windows-latest",
           "cobertura":0,"build_release":"ddc-tray",
           "empacotar_tauri":true,"caminho_tauri":"apps/ddc-tray/src-tauri",
           "binarios_extra":"ddc-cli","carimbar_versao":true},
          {"nome":"node-ui","linguagem":"node","versao":"24","caminho":"apps/ddc-tray"}
        ]

  # The release (D-2026-09-28-release-packaging-7): only on a push, only after
  # every quality job passed on both systems, and only when there is a
  # version to release. On `main` it creates the tag and publishes the GitHub
  # Release with the seven packages, a SHA256SUMS and the CHANGELOG section;
  # on `ensaio-release/**` the same release comes out as a draft. A pull
  # request never gets here.
  lancar:
    needs: [versao, qualidade]
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ensaio-release/'))
      && needs.versao.outputs.salto != 'nenhum'
    # `packages: write` with no image: GitHub checks a reusable workflow's
    # permissions statically, and lancar.yml's `alias` job (skipped here)
    # asks for it. Without it the run dies in startup_failure; the measured
    # message is in lancar.yml's header.
    permissions:
      contents: write
      packages: write
    uses: slipalison/github-workflows/.github/workflows/lancar.yml@d6d340a96e2d2bc645e6e5a4c1e2dfba5637b901
    with:
      versao: ${{ needs.versao.outputs.versao }}
      tag: ${{ needs.versao.outputs.tag }}
      # The same literal as the `versao` job: if it ever changes, it changes
      # in both, in the same commit.
      versao_inicial: "0.1.0"
      # Only the two Rust components that package (`pacotes-rust-linux`,
      # `pacotes-rust-windows`). `pacotes-*` would also attach any artifact
      # another job of the run uploaded under that prefix, node-ui included,
      # which runs third-party npm code (D-2026-09-28-release-packaging-7).
      artefatos: "pacotes-rust-*"
      changelog: CHANGELOG.md
      rascunho: ${{ github.ref != 'refs/heads/main' }}
