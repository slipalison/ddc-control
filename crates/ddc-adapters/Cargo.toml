[package]
name = "ddc-adapters"
description = "Driven adapters for ddc-control's MonitorBackend port."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["ddc-hi"]
ddc-hi = ["dep:ddc-hi"]

[dependencies]
ddc-core = { workspace = true }
ddc-hi = { version = "0.4.1", default-features = false, features = ["ddc-i2c", "ddc-winapi"], optional = true }

[dev-dependencies]
# Only to build real `ddc-hi` error chains in tests; the versions ddc-hi
# already pulls in.
anyhow = "1"
ddc = "=0.2.2"
ddc-i2c = "=0.2.2"

[lints]
workspace = true
