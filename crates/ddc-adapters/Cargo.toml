[package]
name = "ddc-adapters"
description = "Driven adapters for ddc-control's MonitorBackend port."
version.workspace = true
edition.workspace = true
license.workspace = true

# No doctests: an example in a `///` comment would run as a test from inside
# the hardware adapter's production files, which hold no test code
# (D-2026-10-01-input-switch-autostart-3). The crate has none to lose.
[lib]
doctest = false

[features]
default = ["ddc-hi"]
ddc-hi = ["dep:ddc-hi"]

[dependencies]
ddc-core = { workspace = true }
ddc-hi = { version = "0.4.1", default-features = false, features = ["ddc-i2c", "ddc-winapi"], optional = true }

[dev-dependencies]
# Only to build real `ddc-hi` error chains in tests; the versions ddc-hi
# already pulls in.
anyhow = "1"
ddc = "=0.2.2"
ddc-i2c = "=0.2.2"
# A fake sysfs tree of USB devices per test, never the real /sys.
tempfile = "3"

[lints]
workspace = true
